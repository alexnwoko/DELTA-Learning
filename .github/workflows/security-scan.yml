name: Security scan

# Secret, dependency and code scanning for v2 branches (architecture map A16).
# Every action and tool is pinned: actions by commit SHA, binaries by version and checksum.
# Trivy: never use 0.69.4 or trivy-action below 0.35.0 (GHSA-69fq-xp46-6x23).

on:
  push:
    branches:
      - "v2/**"
  pull_request:
    branches:
      - "v2/**"
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Merge gate: fails on any secret not listed in .gitleaksignore.
      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --verbose .

  trivy:
    name: Dependencies and Dockerfiles (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Report-only until the HIGH and CRITICAL baseline in yarn.lock is cleared.
      # Then set exit-code to "1".
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          skip-dirs: node_modules
          exit-code: "0"

  semgrep:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Semgrep 1.180.0
        run: python3 -m pip install --user semgrep==1.180.0

      # Named rulesets only; --config auto sends metrics to Semgrep.
      # Report-only until MapChart.tsx:215 (Analytics) is resolved. Then add --error.
      - name: Scan app/
        run: |
          ~/.local/bin/semgrep scan --metrics=off \
            --config p/typescript --config p/secrets --config p/react \
            --severity ERROR --severity WARNING app/
